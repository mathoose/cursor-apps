<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-label="3D Print icon">
  <defs>
    <linearGradient id="bg" x1="18" y1="8" x2="162" y2="172" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="bed" x1="40" y1="120" x2="140" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#334155"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="filament" x1="70" y1="40" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="180" height="180" rx="38" fill="url(#bg)"/>
  <!-- gantry -->
  <rect x="36" y="34" width="108" height="10" rx="3" fill="#64748b"/>
  <rect x="42" y="44" width="8" height="88" rx="2" fill="#475569"/>
  <rect x="130" y="44" width="8" height="88" rx="2" fill="#475569"/>
  <!-- print head -->
  <g filter="url(#shadow)">
    <rect x="78" y="48" width="24" height="18" rx="4" fill="#94a3b8"/>
    <rect x="86" y="66" width="8" height="14" rx="2" fill="#cbd5e1"/>
  </g>
  <!-- filament path -->
  <path d="M90 40 C90 28 118 24 128 36" fill="none" stroke="#fb923c" stroke-width="5" stroke-linecap="round"/>
  <circle cx="128" cy="36" r="8" fill="#ea580c"/>
  <!-- printed object -->
  <g filter="url(#shadow)">
    <path d="M64 128 L90 78 L116 128 Z" fill="url(#filament)"/>
    <path d="M74 128 L90 98 L106 128 Z" fill="#fdba74" opacity=".55"/>
  </g>
  <!-- bed -->
  <rect x="40" y="128" width="100" height="14" rx="3" fill="url(#bed)" stroke="#64748b" stroke-width="2"/>
  <rect x="48" y="142" width="84" height="6" rx="2" fill="#334155"/>
</svg>
