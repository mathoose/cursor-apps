<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Philly walking map — reference</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="philly-walk-map.css" />
  <style>
    html, body { height: 100%; margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #map { height: calc(100% - 72px); }
    header { padding: 12px 16px; }
    h1 { font-size: 1rem; margin: 0 0 4px; }
    p { margin: 0; font-size: 0.8125rem; color: #555; }
  </style>
</head>
<body>
  <header>
    <h1>Philly walking map</h1>
    <p>Navy Yard → Fishtown / Olde Kensington · 45th St → river (not Camden). Zoom in for names.</p>
  </header>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="philly-walk-map.js"></script>
  <script>
    var map = L.map('map', {
      zoomControl: true,
      maxZoom: 19,
      minZoom: PhillyWalkMap.minZoom,
      maxBounds: PhillyWalkMap.panLatLngBounds(),
      maxBoundsViscosity: PhillyWalkMap.maxBoundsViscosity
    });
    PhillyWalkMap.addTiles(map);
    PhillyWalkMap.applyLimits(map);
    PhillyWalkMap.ensurePinPane(map);
    PhillyWalkMap.bindZoomLabels(map);
    PhillyWalkMap.fit(map);
    L.rectangle(PhillyWalkMap.latLngBounds(), {
      color: '#9a3412',
      weight: 2,
      fill: false
    }).addTo(map);
    L.rectangle(PhillyWalkMap.panLatLngBounds(), {
      color: '#2563eb',
      weight: 1,
      dashArray: '6 4',
      fill: false
    }).addTo(map);
    [
      { lat: 39.9526, lng: -75.1636, name: 'City Hall', fill: '#c62828' },
      { lat: 39.9656, lng: -75.1807, name: 'Art Museum', fill: '#2e7d32' },
      { lat: 39.9708, lng: -75.1347, name: 'Fishtown', fill: '#c2410c' }
    ].forEach(function (p) {
      PhillyWalkMap.addCirclePin([p.lat, p.lng], {
        fillColor: p.fill,
        label: p.name
      }).addTo(map);
    });
  </script>
</body>
</html>
