<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Philly walking map — reference</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    html, body { height: 100%; margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #map { height: calc(100% - 72px); }
    header { padding: 12px 16px; }
    h1 { font-size: 1rem; margin: 0 0 4px; }
    p { margin: 0; font-size: 0.8125rem; color: #555; }
  </style>
</head>
<body>
  <header>
    <h1>Philly walking map</h1>
    <p>Oregon Ave → Fishtown / Olde Kensington · 45th St → river (not Camden)</p>
  </header>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="philly-walk-map.js"></script>
  <script>
    var map = L.map('map', { zoomControl: true, maxZoom: 19 });
    PhillyWalkMap.addTiles(map);
    PhillyWalkMap.applyLimits(map);
    PhillyWalkMap.fit(map);
    L.rectangle(PhillyWalkMap.latLngBounds(), {
      color: '#9a3412',
      weight: 2,
      fill: false
    }).addTo(map);
  </script>
</body>
</html>
