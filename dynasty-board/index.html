<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <title>Dynasty Board</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Dynasty Board" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0b1220" />
  <link rel="icon" href="app-icon.png" type="image/png" />
  <link rel="apple-touch-icon" href="app-icon.png" />
  <link rel="stylesheet" href="../apps-shell.css" />
  <link rel="stylesheet" href="styles.css?v=2" />
</head>
<body>
  <header class="app-header">
    <a href="https://mathoose.github.io/cursor-apps/" class="apps-home-back" data-apps-home aria-label="Back to Apps">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="header-titles">
      <h1>Dynasty Board</h1>
      <p id="headerSub">Superflex dynasty · 5 sources</p>
    </div>
  </header>

  <section class="filters" aria-label="Filters">
    <div class="chips" id="posChips"></div>
    <div class="chips scroll" id="rosterChips" aria-label="Roster filter"></div>
    <label class="toggle">
      <input type="checkbox" id="top14" />
      Top 14 any source
    </label>
    <div class="sliders">
      <label class="slider-block">
        <span>Age <strong id="ageLabel">20–44</strong></span>
        <div class="dual">
          <input type="range" id="ageMin" min="20" max="44" step="0.5" value="20" />
          <input type="range" id="ageMax" min="20" max="44" step="0.5" value="44" />
        </div>
      </label>
      <label class="slider-block">
        <span>Value <strong id="valueLabel">0–10k</strong></span>
        <div class="dual">
          <input type="range" id="valMin" min="0" max="10000" step="250" value="0" />
          <input type="range" id="valMax" min="0" max="10000" step="250" value="10000" />
        </div>
      </label>
    </div>
    <p class="count" id="count"></p>
  </section>

  <main>
    <div class="table-wrap">
      <table id="board">
        <thead>
          <tr id="headRow"></tr>
        </thead>
        <tbody id="body"></tbody>
      </table>
    </div>
    <p class="footnote" id="footnote"></p>
  </main>

  <script src="../apps-backup.js"></script>
  <script src="../apps-photo-picker.js"></script>
  <script src="../apps-shell.js" defer></script>
  <script src="app.js?v=2"></script>
</body>
</html>
