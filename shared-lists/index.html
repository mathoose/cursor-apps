<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <title>Our Lists</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Our Lists" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#5c3b22" />
  <!-- build: shared-lists-v19 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="app-icon.png" type="image/png" />
  <link rel="apple-touch-icon" href="app-icon.png" />
  <link rel="stylesheet" href="../apps-shell.css" />
  <link rel="stylesheet" href="styles.css?v=19" />
</head>
<body>
  <header class="app-header">
    <a href="https://mathoose.github.io/cursor-apps/" class="apps-home-back" data-apps-home aria-label="Back to Apps">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="header-titles">
      <h1>Our Lists</h1>
      <p id="headerSub">Just the two of you</p>
    </div>
    <button type="button" class="header-btn header-icon-btn" id="settingsBtn" hidden aria-label="Settings">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
    </button>
    <button type="button" class="header-btn" id="roomsBtn" hidden>Lists</button>
  </header>

  <main>
    <section id="viewJoin" hidden>
      <div class="card">
        <p class="eyebrow">Our list</p>
        <h2>Packing, for the two of you</h2>
        <p>Add what you’re bringing. On each thing, tap Where and say the last place you saw it. The other phone sees that comment.</p>
        <p class="field-hint" id="codeHint">Opening the list…</p>
      </div>
    </section>

    <section id="viewRoom" hidden>
      <div class="room-bar">
        <button type="button" class="code-pill" id="codePill" hidden></button>
        <p class="sync" id="roomSync" aria-live="polite"></p>
      </div>
      <button type="button" class="btn btn-primary" id="newListBtn">New list</button>
      <button type="button" class="btn btn-secondary" id="pastPackedBtn" data-action="open-past-packed" hidden>Past packed</button>
      <div id="roomLists"></div>
      <button type="button" class="btn btn-quiet danger-text" id="forgetBtn">Clear the copy on this phone</button>
    </section>

    <section id="viewList" hidden>
      <button type="button" class="back-to-desk" id="backLists">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        <span>Back to all notes</span>
      </button>
      <div id="paper" class="paper tone-butter paper-small">
      <div class="paper-tools">
        <button type="button" class="activity-mark" id="activityMark" aria-label="Activity on this note" aria-expanded="false" aria-controls="activityPop">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 14h3l2-7 4 14 2-7h5"/></svg>
        </button>
        <button type="button" class="color-mark swatch-butter" id="colorMark" aria-label="Change note color" aria-expanded="false" aria-controls="colorPop"></button>
      </div>
      <label class="sr-only" for="listTitle">List name</label>
      <input id="listTitle" class="title-input title-input-full" type="text" maxlength="80" placeholder="List name" autocomplete="off" />
      <div id="activityPop" class="activity-pop" hidden role="dialog" aria-label="Activity"></div>
      <div id="colorPop" class="color-pop" hidden role="dialog" aria-label="Note colors"></div>
      <div class="card-notes-block">
        <p class="field-label">Comments</p>
        <div id="cardNoteThread" class="card-note-thread" aria-live="polite"></div>
        <form id="cardNoteForm" class="card-note-form">
          <label class="sr-only" for="cardNoteDraft">Comment</label>
          <textarea id="cardNoteDraft" class="card-note-input" rows="2" maxlength="280" placeholder="Comment for both of you"></textarea>
          <label class="sr-only" for="cardNoteLink">Link</label>
          <input id="cardNoteLink" type="url" inputmode="url" maxlength="500" placeholder="Link (optional)" autocomplete="off" />
          <button type="submit" class="btn btn-secondary card-note-post">Post comment</button>
        </form>
      </div>
      <form id="addForm" class="add-row">
        <input id="addInput" type="text" maxlength="140" placeholder="Add an item" autocomplete="off" enterkeyhint="done" />
        <button type="submit" class="add-btn" aria-label="Add item">+</button>
      </form>
      <div id="itemList"></div>
      <div id="historyBlock"></div>
      <button type="button" class="btn btn-secondary" id="addPastBtn" data-action="add-past-to-list" hidden>Add from past packed</button>
      <div class="list-actions">
        <button type="button" class="btn btn-secondary" id="copyListBtn">Copy list</button>
        <button type="button" class="btn btn-quiet danger-text" id="deleteListBtn">Delete list</button>
      </div>
      <button type="button" class="paper-pop-scrim" id="paperPopScrim" hidden tabindex="-1" aria-label="Close panel"></button>
      </div>
    </section>
  </main>

  <div id="sheet" class="sheet" hidden>
    <button type="button" class="sheet-backdrop" id="sheetBackdrop" aria-label="Close"></button>
    <div class="sheet-card" id="sheetBody" role="dialog" aria-modal="true"></div>
  </div>
  <div id="toast" class="toast" hidden></div>
  <footer class="app-version-footer"><p class="app-version" aria-label="App version">v19 · Nov 28, 2026</p></footer>

  <script src="logic.js?v=19"></script>
  <script src="../trip-packing/logic.js?v=19"></script>
  <script src="app.js?v=19"></script>
  <script src="../apps-backup.js"></script>
  <script src="../apps-shell.js" defer></script>
</body>
</html>
